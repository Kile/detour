# XcodeGen spec. The generated SideQuest.xcodeproj is committed too, so you only
# need XcodeGen (`brew install xcodegen`) if you add/remove files: run `xcodegen`.
name: SideQuest
options:
  bundleIdPrefix: dev.sidequest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
fileGroups:
  - GPX
  - README.md
targets:
  SideQuest:
    type: application
    platform: iOS
    sources:
      - path: SideQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sidequest.SideQuest
        PRODUCT_NAME: SideQuest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Detour
        INFOPLIST_KEY_NSCameraUsageDescription: "Detour uses the camera so you can snap a photo to complete your quest. A photo is only taken when you tap the shutter."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Detour uses your location only while the app is open, to find real places near you for quests and to check you're near the quest spot when you snap your photo. Your exact coordinates are never sent to the AI."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Release:
          # The bundled test photos exist only so the simulator (no camera) can be used. Never ship them.
          EXCLUDED_SOURCE_FILE_NAMES: "debug_test_*"
  SideQuestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SideQuestTests
    dependencies:
      - target: SideQuest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.sidequest.SideQuestTests
  SideQuestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SideQuestUITests
    dependencies:
      - target: SideQuest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.sidequest.SideQuestUITests
        TEST_TARGET_NAME: SideQuest
schemes:
  SideQuest:
    build:
      targets:
        SideQuest: all
        SideQuestTests: [test]
        SideQuestUITests: [test]
    run:
      config: Debug
      # Launch without attaching LLDB: Xcode 27's debugger stalls at dyld's lldb_image_notifier on the
      # iOS 17.5 simulator. Re-enable in Edit Scheme → Run → Info → "Debug executable" if you need breakpoints.
      debugEnabled: false
      simulateLocation:
        allow: true
        defaultLocation: GPX/London-CoventGarden.gpx
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SideQuestTests
        - SideQuestUITests
    archive:
      config: Release
